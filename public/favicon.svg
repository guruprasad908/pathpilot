<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#060810"/>
  <!-- Orbit ring -->
  <ellipse cx="16" cy="16" rx="11" ry="4" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.5"/>
  <!-- Small dot on orbit -->
  <circle cx="27" cy="16" r="2" fill="#22d3ee" opacity="0.9"/>
  <!-- Center planet -->
  <circle cx="16" cy="16" r="5" fill="#0e7490" opacity="0.9"/>
  <circle cx="16" cy="16" r="5" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.7"/>
  <!-- Glow highlight -->
  <circle cx="14" cy="14" r="1.5" fill="white" opacity="0.2"/>
</svg>
